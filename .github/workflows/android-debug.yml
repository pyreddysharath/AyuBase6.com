name: Android debug APK

# Builds an installable debug APK from this repository plus the web app (pyreddysharath/AyuBase6.com).
# The APK is attached to this run and published as the "debug-latest" pre-release (Releases page).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      web_ref:
        description: Web app branch, tag or commit to bundle
        default: main

permissions:
  contents: write

concurrency:
  group: android-debug
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out the web app
        uses: actions/checkout@v4
        with:
          repository: pyreddysharath/AyuBase6.com
          ref: ${{ github.event.inputs.web_ref || 'main' }}
          path: web
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # The same debug signing key on every build, so a new APK installs over the old one and keeps the app's data.
      # Optional secret DEBUG_KEYSTORE_B64 (base64 of a debug.keystore) makes it permanent; otherwise it is kept in the cache.
      - name: Restore debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1
      - name: Use debug signing key from secret (if set)
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then mkdir -p ~/.android; echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore; fi
          if [ ! -f ~/.android/debug.keystore ]; then
            mkdir -p ~/.android
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Install
        run: npm ci

      - name: Bundle the web app
        run: |
          WEB_DIR=web npm run prepare-www
          npx cap sync android
          echo "WEB_SHA=$(git -C web rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Unit tests (reminder rules match the push server)
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/AyuBase6-debug-${VERSION_CODE}.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: AyuBase6-debug-${{ github.run_number }}
          path: out/*.apk

      - name: Publish as the "debug-latest" pre-release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest out/*.apk --prerelease --target "$GITHUB_SHA" \
            --title "Debug build ${VERSION_CODE}" \
            --notes "Debug APK for testing. App ${GITHUB_SHA::7}, web app ${WEB_SHA}. Install on the phone and allow notifications."
